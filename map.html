<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>当前位置地图</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8f0; }
    .map-wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .map-grid { position: absolute; }
    .tile { position: absolute; width: 256px; height: 256px; background-size: 256px 256px; }
    .pin {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -100%);
      font-size: 24px;
      line-height: 1;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.45));
      pointer-events: none;
      z-index: 2;
    }
    .pin-label {
      position: absolute;
      left: 50%;
      top: calc(50% + 12px);
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.94);
      color: #333;
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 10px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.28);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      z-index: 2;
    }
    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      font-size: 12px;
      font-family: "Microsoft YaHei", sans-serif;
    }
  </style>
</head>
<body>
  <div class="map-wrap">
    <div class="loading" id="loading">地图加载中…</div>
    <div class="map-grid" id="map-grid"></div>
    <div class="pin">📍</div>
    <div class="pin-label" id="pin-label"></div>
  </div>
  <script src="js/map.js"></script>
</body>
</html>
